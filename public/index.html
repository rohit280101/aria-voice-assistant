<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARIA — Voice Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo">ARIA <span>Voice Task Manager</span></div>
    <div class="header-right">
      <div class="agent-pipeline" id="agentPipeline" title="Agent pipeline status">
        <div class="agent-step" id="agentConversation" title="Conversation Agent">C</div>
        <div class="agent-step" id="agentPlanner" title="Planner Agent">P</div>
        <div class="agent-step" id="agentExecution" title="Execution Agent">E</div>
        <div class="agent-step" id="agentResponse" title="Response Agent">R</div>
      </div>
      <div class="header-status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">connecting...</span>
      </div>
    </div>
  </header>

  <main>
    <div class="task-panel">
      <div class="panel-header">
        <span class="panel-title">Tasks</span>
        <span class="task-count" id="taskCount">0</span>
      </div>
      <div class="filter-bar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="today">Today</button>
        <button class="filter-btn" data-filter="tomorrow">Tomorrow</button>
        <button class="filter-btn" data-filter="done">Done</button>
      </div>
      <div class="task-list" id="taskList"></div>
    </div>

    <div class="voice-center">
      <div class="bg-grid"></div>

      <div id="noSttBanner" class="no-stt-banner" style="display:none">
        Speech recognition not supported in this browser. Please use Chrome or Edge.
      </div>

      <div class="interruption-banner" id="intrBanner">Interrupted — listening...</div>

      <div class="voice-orb-container">
        <div class="orb-ring"></div>
        <div class="orb-ring"></div>
        <div class="orb-ring"></div>
        <button class="voice-btn" id="voiceBtn" aria-label="Toggle voice input">
          <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="12" y1="19" x2="12" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="8" y1="23" x2="16" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <div class="wave-icon">
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
            <span class="wave-bar"></span>
          </div>
        </button>
      </div>

      <div class="voice-state-label" id="voiceLabel">tap to speak</div>
      <div class="transcript-area" id="transcriptArea"></div>

      <div class="bottom-hints">
        <button class="hint-chip" data-hint="Create a task for team sync at 10 AM tomorrow">+ create</button>
        <button class="hint-chip" data-hint="What are my tasks for today?">read tasks</button>
        <button class="hint-chip" data-hint="Mark the first task as done">complete</button>
        <button class="hint-chip" data-hint="Delete all completed tasks">delete</button>
        <button class="hint-chip" data-hint="What is on my agenda this morning?">agenda</button>
      </div>
    </div>
  </main>

  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <div class="confirm-title">confirm deletion</div>
      <div class="confirm-msg" id="confirmMsg">Are you sure you want to delete this task?</div>
      <div class="confirm-task" id="confirmTask"></div>
      <div class="confirm-hint">Say "yes" to confirm or "no" to cancel</div>
    </div>
  </div>

  <div class="toast" id="toast">
    <span class="toast-icon" id="toastIcon"></span>
    <span id="toastMsg"></span>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
